name: Test on Linux

on:
  push:
    branches: [ master ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.config.os }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 1
    strategy:
      fail-fast: false
      matrix:
        config:
        - {os: ubuntu-latest}

    steps:
      - uses: actions/checkout@v6

      - name: Info
        env:
          REF: ${{ github.ref }}
        run: |
          echo "$REF"
          bash --version | head -n 1

      - name: Run Tester
        run: ./tester.sh
